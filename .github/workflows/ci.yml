name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shared-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:jvmTest :androidApp:assembleDebug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build for an arm64 simulator
        working-directory: iosApp
        run: >
          xcodebuild -project Teknotes.xcodeproj -scheme Teknotes
          -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO build

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,imgproxy,vector,logflare,realtime,storage-api,supavisor
      - run: supabase test db
